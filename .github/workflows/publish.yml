name: Publish to NPM

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

jobs:
  publish:
    # Dependency installs use Socket on the corporate runner network.
    runs-on: ci-standard
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node <<'NODE'
          const version = require('./package.json').version;
          const tag = process.env.RELEASE_TAG.replace(/^v/, '');
          if (tag !== version) {
            console.error(`Release tag ${process.env.RELEASE_TAG} does not match package version ${version}`);
            process.exit(1);
          }
          NODE
      - run: npm ci
      - name: Set package version from release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --ignore-scripts --allow-same-version
      - run: npm run build
      
      - run: npm publish --access public --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
